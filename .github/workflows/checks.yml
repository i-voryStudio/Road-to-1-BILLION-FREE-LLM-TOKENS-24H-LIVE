name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only, stated explicitly. This workflow runs code from forks (via pull_request, never
# pull_request_target), so it must never hold a token that can write anything, and it makes no network
# call beyond the checkout: the quality scores it ranks with are the committed snapshot, guarded by
# gate_drift.py.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, pinned: a tag can be moved, a SHA cannot
        with:
          # The whole history: the pull-request gate diffs base...head, and the publication gate's history
          # mode reads every commit the pull request brings. A shallow clone has neither.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, pinned
        with:
          python-version: '3.12'

      # 0. The structural wall, before anything else. Measurements are made, never contributed: a pull
      #    request may not touch data/uptime.jsonl, data/throughput.jsonl, data/drawn.jsonl,
      #    data/reliability.json, data/scores.json, results/ or the rest of the list the gate prints with
      #    --list-walls, whatever the line says; and an entry that exists on the base branch in
      #    bench/key_bindings.json, bench/providers.json or the host maps may be added next to, never edited.
      #    The gate runs from the BASE branch's copy of itself, so a pull request that edits bench/gate_pr.py
      #    is still checked by the gate main has. The title reaches the script through an environment
      #    variable, never by interpolation into the shell.
      - name: Measurements are made, never contributed, and an existing key line is never edited
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if git cat-file -e "$BASE_SHA:bench/gate_pr.py" 2>/dev/null; then
            git show "$BASE_SHA:bench/gate_pr.py" > /tmp/gate_pr_base.py
            GATE=/tmp/gate_pr_base.py
          else
            GATE=bench/gate_pr.py   # only the pull request that introduces the gate
          fi
          python "$GATE" --root . --base "$BASE_SHA" --head HEAD --title "$PR_TITLE"

      # 1. Every checker and every gate is tested in BOTH directions before it is trusted with anything.
      #    A gate that has never been watched failing is a green light, not a gate.
      - name: Probe checkers, both directions
        run: python bench/test_probes.py
      - name: Publication gate, both directions
        run: python bench/test_gate.py
      - name: Pull-request gate, both directions
        run: python bench/test_pr.py
      - name: Contribution gate, both directions
        run: python bench/test_contributions.py
      - name: Model matching, both directions
        run: python bench/test_scores.py
      - name: Jury maths, both directions
        run: python bench/test_jury.py
      - name: Score-drift gate, both directions
        run: python bench/test_drift.py
      - name: Fourteen-day rule, both directions
        run: python bench/test_viability.py
      - name: Page generator, golden fixture
        run: python bench/test_rank.py
      - name: Sustained-draw meter, no network
        run: python bench/test_draw.py
      - name: Claims gate, both directions
        run: python bench/test_claims.py
      - name: The headline recomputed from the raw files, without rank.py
        run: python bench/test_shelf.py

      # 2. The gates, on what is actually committed.
      - name: Nothing private may ship
        run: python bench/gate_publish.py .
      # History mode reads `git log --all --reflog -p`. On this full-depth checkout of the merge ref that
      # is every commit the pull request brings, with its message, author and committer. A key or an
      # account state that a contributor committed and then deleted is still in the history, and so is a
      # trailer in a message; the working-tree mode above cannot see either.
      - name: Nothing private may ship, in the commits this pull request brings either
        if: github.event_name == 'pull_request'
        run: python bench/gate_publish.py --history .
      - name: Contribution data is sane, and a key goes to one host only
        run: python bench/gate_contributions.py
      - name: The imported scores are numeric and fresh, and on a pull request drifted no further than the bounds since the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && git show "$BASE_SHA:data/scores.json" > /tmp/scores-base.json 2>/dev/null; then
            python bench/gate_drift.py --check data/scores.json --today "$(date -u +%F)" --previous /tmp/scores-base.json
          else
            python bench/gate_drift.py --check data/scores.json --today "$(date -u +%F)"
          fi
      - name: Every published number is in the data, checked on the COMMITTED pages
        run: python bench/gate_claims.py
      # The gate computes its page list from the tree (every *.md at the root plus the language-pack
      # README), so comparing that list with a glob of the same tree could never fail. The reference here
      # is git's index instead: every tracked Markdown page must be on the gate's list, except the GitHub
      # templates under .github/, the golden fixtures under bench/tests/ and the archived runs under
      # results/, which are not pages. A new bench/README.md or docs/BEST.md with a table nobody checks
      # fails here until the gate opens it.
      - name: Every tracked page is on the claims gate's list
        run: |
          python bench/gate_claims.py --list-pages | tr -d '\r' | sort > /tmp/gate-pages.txt
          git ls-files -- '*.md' | grep -v -E '^(\.github/|bench/tests/|results/)' | sort > /tmp/tracked-pages.txt
          UNCHECKED=$(comm -23 /tmp/tracked-pages.txt /tmp/gate-pages.txt)
          if [ -n "$UNCHECKED" ]; then
            echo "tracked by git, and the claims gate does not open them:"; echo "$UNCHECKED"; exit 1
          fi
          echo "every tracked page is on the list:"; cat /tmp/gate-pages.txt
      - name: Uptime history is well-formed
        run: python bench/gate_viability.py --today "$(date -u +%F)" --out /tmp/GRAVEYARD-check.md

      # 3. The committed pages must be exactly what the generator produces from the committed data.
      #    Regenerate at the date the pages were generated on, then demand zero diff. A pull request that
      #    hand-edits a table, or edits data without regenerating, fails here rather than after merge.
      - name: Regeneration is a no-op on the committed data
        run: |
          DATE=$(python -c 'import json;print(json.load(open("data/ranking.json"))["measured_at"])')
          python bench/gate_viability.py --today "$DATE"
          python bench/rank.py --date "$DATE" --out .
          git diff --exit-code -- README.md RESULTS.md ALL-ENDPOINTS.md LIMITS.md GRAVEYARD.md data/ranking.json data/ranking.csv data/capacity.json data/viability.json

      # 4. The claims gate again, on what the generator just wrote. The step above proves the committed
      #    pages equal the generator's output; this one proves the generator's output is in the data. A
      #    provider-specific branch in rank.py passes the first and has to face the second.
      - name: Every published number is in the data, checked again on the REGENERATED pages
        run: python bench/gate_claims.py --root .
