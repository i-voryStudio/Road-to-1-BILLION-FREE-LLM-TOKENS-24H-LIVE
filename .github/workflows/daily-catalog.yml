name: Daily catalog check

# Every list like this one goes stale within a month. This job is the cheapest defence: it re-reads the
# provider catalogues that answer without a key, records what appeared and what vanished, and commits the
# diff. No secrets are used, so it also runs on forks.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Two runs must not race each other into the same file.
concurrency:
  group: daily-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, pinned: a tag can be moved, a SHA cannot
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, pinned
        with:
          python-version: '3.12'

      - name: Re-read public catalogues
        run: python bench/refresh_catalog.py --out data/catalog.json --date "$(date -u +%F)"

      - name: Probe checkers must still pass
        run: python bench/test_probes.py

      - name: Jury maths
        run: python bench/test_jury.py

      - name: The publication gate must still catch what it claims to
        run: python bench/test_gate.py

      - name: Contribution data must still be sane
        run: python bench/gate_contributions.py

      # Quality is imported, not run by us: a new provider inherits its models' published scores.
      # Reliability and the reasoning trap are measured from our own runs and feed the ranking.
      - name: Refresh imported scores and measured reliability
        run: |
          python bench/scores.py --out data/scores.json --date "$(date -u +%F)"
          python bench/reliability.py --out data/reliability.json --date "$(date -u +%F)"
          python bench/rank.py --date "$(date -u +%F)" --out .

      # The 14-day rule, applied by code. Free endpoints die in months and usually without an
      # announcement; what dies gets a date and a headstone rather than quietly disappearing.
      # probe_alive.py needs keys and runs where they exist - this only reads the history it leaves.
      - name: Apply the fourteen-day rule
        run: python bench/gate_viability.py --today "$(date -u +%F)"

      - name: Published numbers must exist in the data
        run: python bench/gate_claims.py

      - name: Improvements journal must be alive
        run: python bench/gate_improvements.py --today "$(date -u +%F)"

      - name: Nothing private may ship
        run: python bench/gate_publish.py .

      - name: Commit the diff, if there is one
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/ README.md RESULTS.md; then
            echo "nothing changed today - no commit. A commit that moves only a timestamp is noise."
          else
            git add data/ README.md RESULTS.md
            git commit -m "daily: $(date -u +%F) catalogue, scores and reliability"
            # Somebody may have pushed while this job was running; rebase rather than fail.
            git pull --rebase --autostash origin main
            git push
          fi
