name: Daily catalog check

# Every list like this one goes stale within a month. This job is the cheapest defence: it re-reads the
# provider catalogues that answer without a key, records what appeared and what vanished, and commits the
# diff. No secrets are used, so it also runs on forks.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-read public catalogues
        run: python bench/refresh_catalog.py --out data/catalog.json --date "$(date -u +%F)"

      - name: Probe checkers must still pass
        run: python bench/test_probes.py

      - name: The publication gate must still catch what it claims to
        run: python bench/test_gate.py

      - name: Contribution data must still be sane
        run: python bench/gate_contributions.py

      - name: Nothing private may ship
        run: python bench/gate_publish.py .

      - name: Commit the diff, if there is one
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/catalog.json; then
            echo "catalog unchanged, nothing to commit"
          else
            git add data/catalog.json
            git commit -m "catalog: $(date -u +%F) automatic check"
            git push
          fi
