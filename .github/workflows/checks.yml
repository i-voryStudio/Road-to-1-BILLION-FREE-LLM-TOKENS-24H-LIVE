name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only, stated explicitly. This workflow runs code from forks (via pull_request, never
# pull_request_target), so it must never hold a token that can write anything, and it makes no network
# call: the quality scores it ranks with are the committed snapshot, guarded by gate_drift.py.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, pinned: a tag can be moved, a SHA cannot
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, pinned
        with:
          python-version: '3.12'

      # 1. Every checker and every gate is tested in BOTH directions before it is trusted with anything.
      #    A gate that has never been watched failing is a green light, not a gate.
      - name: Probe checkers, both directions
        run: python bench/test_probes.py
      - name: Publication gate, both directions
        run: python bench/test_gate.py
      - name: Contribution gate, both directions
        run: python bench/test_contributions.py
      - name: Model matching, both directions
        run: python bench/test_scores.py
      - name: Jury maths, both directions
        run: python bench/test_jury.py
      - name: Score-drift gate, both directions
        run: python bench/test_drift.py
      - name: Fourteen-day rule, both directions
        run: python bench/test_viability.py
      - name: Page generator, golden fixture
        run: python bench/test_rank.py
      - name: Sustained-draw meter, no network
        run: python bench/test_draw.py
      - name: Claims gate, both directions
        run: python bench/test_claims.py

      # 2. The gates, on what is actually committed.
      - name: Nothing private may ship
        run: python bench/gate_publish.py .
      - name: Contribution data is sane, and a key goes to one host only
        run: python bench/gate_contributions.py
      - name: The imported scores are numeric and fresh
        run: python bench/gate_drift.py --check data/scores.json --today "$(date -u +%F)"
      - name: Every published number is in the data, checked on the COMMITTED pages
        run: python bench/gate_claims.py
      - name: Uptime history is well-formed
        run: python bench/gate_viability.py --today "$(date -u +%F)" --out /tmp/GRAVEYARD-check.md

      # 3. The committed pages must be exactly what the generator produces from the committed data.
      #    Regenerate at the date the pages were generated on, then demand zero diff. A pull request that
      #    hand-edits a table, or edits data without regenerating, fails here rather than after merge.
      - name: Regeneration is a no-op on the committed data
        run: |
          DATE=$(python -c 'import json;print(json.load(open("data/ranking.json"))["measured_at"])')
          python bench/gate_viability.py --today "$DATE"
          python bench/rank.py --date "$DATE" --out .
          git diff --exit-code -- README.md RESULTS.md ALL-ENDPOINTS.md LIMITS.md GRAVEYARD.md data/ranking.json data/ranking.csv data/capacity.json data/viability.json
