name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Read-only, stated explicitly. This workflow runs code from forks (via pull_request, never
# pull_request_target), so it must never hold a token that can write anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, pinned: a tag can be moved, a SHA cannot
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0, pinned
        with:
          python-version: '3.12'

      # The probe checkers decide every score in this repo. If they drift, the whole table is wrong,
      # so they are tested in both directions: correct answers must pass, wrong answers must fail.
      - name: Probe checkers
        run: python bench/test_probes.py

      # The gate itself is tested, in both directions. A gate that has never caught anything is a
      # green light, not a gate: every case in here slipped through a real version of it.
      - name: Publication gate, tested
        run: python bench/test_gate.py

      # Blocks a key, an account balance or a private path from ever reaching a commit.
      # Agreement between judges is half the credibility of every quality score. The maths that
      # reports it is tested in both directions: perfect agreement must read as perfect, a split
      # jury as split, and "one judge is harsher" must not be flattened into "they disagree".
      - name: Jury maths
        run: python bench/test_jury.py

      - name: Publication gate
        run: python bench/gate_publish.py .

      # The sharpest edge in the repo: benchmark.py reads BOTH the endpoint and the key variable out of
      # providers.json, and CONTRIBUTING.md invites strangers to edit it. This refuses any pull request
      # that would point an existing key variable at a new host.
      - name: Contribution gate
        run: python bench/gate_contributions.py

      # A public "things to improve" list is the easiest file in any repo to let rot. This fails when
      # it does: stale entries, no location on disk, a fix with no gate to keep it fixed.
      # Prose does not get to state a score. Every model->quality pair published in a table must
      # match data/models.json, and every file a document claims is "in this repo" must exist.
      - name: Published numbers must exist in the data
        run: python bench/gate_claims.py

      - name: Improvements journal must be alive
        run: python bench/gate_improvements.py --today "$(date -u +%F)"

      - name: Language packs are valid JSON with the required fields
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          required = {"language", "code", "probes", "jury"}
          bad = []
          for p in sorted(Path("bench/languages").glob("*.json")):
              d = json.loads(p.read_text(encoding="utf-8"))
              missing = required - set(d)
              if missing:
                  bad.append("%s: missing %s" % (p.name, sorted(missing)))
              for name, spec in d.get("probes", {}).items():
                  if "prompt" not in spec or "kind" not in spec:
                      bad.append("%s: probe %s needs a prompt and a kind" % (p.name, name))
              print("%-12s %s, %d probes, %d lenses" % (p.name, d.get("language"), len(d.get("probes", {})), len(d.get("jury", {}))))
          if bad:
              print("\n".join(bad)); sys.exit(1)
          PY
